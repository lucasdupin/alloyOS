[workspace]
members = [
    "crates/alloyos-proto",
    "crates/alloyos-boot",
    "crates/alloyos-kernel",
    "crates/alloyos-user",
    "crates/alloyos-ferrofluid",
    "crates/alloyos-keyboard",
    "crates/alloyos-js",
    "crates/alloyos-mcp",
    "crates/alloyos-forge",
    "crates/alloyos-welder",
    "crates/alloyos-dev-harness",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.test]
opt-level = 1
