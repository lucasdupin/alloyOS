[workspace]
members = [
    "crates/metalos-proto",
    "crates/metalos-boot",
    "crates/metalos-kernel",
    "crates/metalos-user",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
bootloader = "0.11"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.test]
opt-level = 1
