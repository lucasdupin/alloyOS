[package]
name = "alloyos-ferrofluid"
version.workspace = true
edition.workspace = true

[lib]
name = "alloyos_ferrofluid"
path = "src/lib.rs"

[dependencies]
libm = "0.2"
alloyos-keyboard = { path = "../alloyos-keyboard" }
alloyos-proto = { path = "../alloyos-proto" }
alloyos-mcp = { path = "../alloyos-mcp" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "unsafe-single-threaded", "libm", "renderer-software"] }

[build-dependencies]
alloyos-proto = { path = "../alloyos-proto" }
slint-build = "=1.18.1"

[dev-dependencies]
png = "=0.18.1"
