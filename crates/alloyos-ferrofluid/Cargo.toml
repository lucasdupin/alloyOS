[package]
name = "alloyos-ferrofluid"
version.workspace = true
edition.workspace = true

[lib]
name = "alloyos_ferrofluid"
path = "src/lib.rs"

[dependencies]
alloyos-user = { path = "../alloyos-user", optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
libm = "0.2"
alloyos-keyboard = { path = "../alloyos-keyboard" }
alloyos-proto = { path = "../alloyos-proto" }
alloyos-mcp = { path = "../alloyos-mcp" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "unsafe-single-threaded", "libm", "renderer-software", "software-renderer-path"] }

[build-dependencies]
alloyos-proto = { path = "../alloyos-proto" }
slint-build = "=1.18.1"

[dev-dependencies]
alloyos-js = { path = "../alloyos-js" }
png = "=0.18.1"

[features]
executable = ["dep:alloyos-user"]

[[bin]]
name = "ferrofluid"
path = "src/main.rs"
required-features = ["executable"]
test = false
