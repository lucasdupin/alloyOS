[package]
name = "alloyos-user"
version.workspace = true
edition.workspace = true

[lib]
name = "liballoy"
path = "src/lib.rs"

[[bin]]
name = "sh"
path = "src/bin/sh.rs"

[[bin]]
name = "app-runner"
path = "src/bin/app-runner.rs"

[dependencies]
alloyos-js = { path = "../alloyos-js" }
linked_list_allocator = "0.10"
alloyos-proto = { path = "../alloyos-proto" }

[dev-dependencies]
# For integration tests we can use std

[features]
default = []
host-tests = []
