[package]
name = "alloyos-welder"
version = "0.1.0"
edition = "2021"

[dependencies]
alloyos-forge = { path = "../alloyos-forge" }
alloyos-js = { path = "../alloyos-js" }
alloyos-mcp = { path = "../alloyos-mcp" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

alloyos-proto = { path = "../alloyos-proto" }
