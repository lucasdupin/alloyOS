[package]
name = "metalos-ferrofluid"
version.workspace = true
edition.workspace = true

[lib]
name = "metalos_ferrofluid"
path = "src/lib.rs"

[dependencies]
libm = "0.2"
metalos-keyboard = { path = "../metalos-keyboard" }
metalos-proto = { path = "../metalos-proto" }
metalos-mcp = { path = "../metalos-mcp" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-18", "unsafe-single-threaded", "libm", "renderer-software"] }

[build-dependencies]
metalos-proto = { path = "../metalos-proto" }
slint-build = "=1.18.1"

[dev-dependencies]
png = "=0.18.1"
