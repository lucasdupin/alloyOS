[package]
name = "metalos-welder"
version = "0.1.0"
edition = "2021"

[dependencies]
metalos-forge = { path = "../metalos-forge" }
metalos-js = { path = "../metalos-js" }
metalos-mcp = { path = "../metalos-mcp" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
