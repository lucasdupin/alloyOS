[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
alloyos-proto = { path = "../crates/alloyos-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
alloyos-dev-harness = { path = "../crates/alloyos-dev-harness" }
alloyos-kernel = { path = "../crates/alloyos-kernel" }

[dev-dependencies]
alloyos-mcp = { path = "../crates/alloyos-mcp" }
